      html,

      body {

        outline: 2px solid var(--accent);

      }
      button.primary {
        background: var(--accent);
        color: var(--sheet);
        border-color: var(--accent);
      }

        font: 12px var(--f-mono);
        color: var(--ink-2);
        min-width: 9ch;
        align-self: center;
        text-align: right;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
      }
      #vp {
        position: relative;
        flex: 1;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        background:
          radial-gradient(circle, var(--rule) 1px, transparent 1.2px) 0 0 / 24px
            24px,
          var(--bg);
      }
      #vp.dragging {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        --k: 1;
      }
      #edges {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      #edges path {
        fill: none;
        stroke: var(--edge);
        stroke-width: calc(1.4px * var(--k));
        opacity: 0.35;
      }
      #edges path.hot {
        stroke: var(--accent);
        opacity: 0.95;
        stroke-width: calc(2.4px * var(--k));
      }
      #edges marker path {
        fill: var(--edge);
        stroke: none;
        opacity: 0.6;
      }
      #edges .elabel {
        display: none;
      }
      .z2 #edges .elabel,
      #edges .elabel.hot {
        display: block;
      }
      #edges .elabel rect {
        fill: var(--sheet);
        stroke: var(--rule);
      }
      #edges .elabel text {
        fill: var(--ink-2);
        font: 13px var(--f-mono);
      }
      #edges .elabel.hot text {
        fill: var(--ink);
      }

        position: absolute;
        border: 2px solid var(--rule);
        border-radius: 4px;
        background: var(--sheet);
      }
      .area > .atitle {
        position: absolute;
        left: 24px;
        font: 600 clamp(44px, calc(20px * var(--k)), 128px)/1 var(--f-display);
        color: var(--ac);
        white-space: nowrap;
        pointer-events: none;
      }
      .area.up > .atitle {
        top: 22px;
      }
      .area.down > .atitle {
        bottom: 22px;
      }
      .area.shared > .atitle {
        top: 18px;
      }
      .area .asub {
        position: absolute;
        left: 26px;
        font: 15px var(--f-mono);
        color: var(--ink-2);
        pointer-events: none;
      }
      .z0 .area .asub {
        display: none;
      }
      .area.up > .asub {
        top: 108px;
      }
      .area.down > .asub {
        bottom: 108px;
      }
      .area.shared > .asub {
        top: 108px;
      }
      .z1 .area .asub {
        font-size: 26px;
      }
      .box {
        position: absolute;
        width: 260px;
        height: 110px;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1.5px solid var(--ac);
        border-left-width: 6px;
        border-radius: 3px;
        background: var(--panel);
        cursor: pointer;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .box .bl {
        font: 600 clamp(16px, calc(11.5px * var(--k)), 38px)/1.1 var(--f-body);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow-wrap: anywhere;
      }
      .box .bk {
        font: 11px var(--f-mono);
        color: var(--ink-2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .box .bf {
        font: 11px var(--f-mono);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .z0 .box .bk,
      .z0 .box .bf,
      .z1 .box .bf {
        display: none;
      }
      .z0 .box .bl,
      .z1 .box .bl {
        -webkit-line-clamp: 2;
      }
      .box.ext {
        border-style: dashed;
        border-left-style: solid;
      }
      .box.sel,
      .step.sel {
        box-shadow: 0 0 0 4px var(--accent);
      }
      .box.dim {
        opacity: 0.35;
      }
      .box .fr {
        position: absolute;
        right: 8px;
        top: 8px;
        font: 700 11px var(--f-mono);
        color: var(--sev-high);
      }
      .flow {
        position: absolute;
        width: 270px;
        box-sizing: border-box;
      }
      .flow h3 {
        margin: 0 0 8px;
        font: 600 clamp(15px, calc(10.5px * var(--k)), 40px)/1.15

        color: var(--ink);
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .flow h3 small {
        display: block;
        font: 11px/1.3 var(--f-mono);
        color: var(--ink-2);
        margin-top: 3px;
      }
      .z0 .flow h3 small {
        display: none;
      }
      .step {
        position: relative;
        box-sizing: border-box;
        height: 104px;
        margin-bottom: 14px;
        padding: 7px 9px 7px 30px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-left: 5px solid var(--sc);
        border-radius: 3px;
        cursor: pointer;
        overflow: hidden;
      }
      .step:not(:last-child)::after {
        content: "";
        position: absolute;
        left: 12px;
        bottom: -14px;
        height: 14px;
        border-left: 2px solid var(--rule);
      }
      .step .n {
        position: absolute;
        left: 7px;
        top: 7px;
        font: 700 12px var(--f-mono);
        color: var(--ink-2);
      }
      .step .sc {
        font: 600 11px/1.2 var(--f-body);
        color: var(--sc);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .step .sa {
        font: 12px/1.3 var(--f-body);
        margin: 2px 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .step .sf {
        font: 10.5px/1.25 var(--f-mono);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .z0 .step > *,
      .z1 .step .sa,
      .z1 .step .sf {
        visibility: hidden;
      }
      .z0 .step {
        background: color-mix(in srgb, var(--sc) 30%, var(--panel));
      }
      .z1 .step .sc {
        font-size: 15px;
      }
      .hint {
        position: absolute;
        left: max(12px, env(safe-area-inset-left, 0px));
        bottom: max(12px, env(safe-area-inset-bottom, 0px));
        background: var(--sheet);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        color: var(--ink-2);
        max-width: min(420px, calc(100% - 24px));
        pointer-events: none;
      }
      aside#panel {

      }

      #panel p {

      }

        font: 12px var(--f-mono);
        color: var(--ink-2);
      }

        display: inline-block;

        letter-spacing: 0.06em;
        padding: 3px 6px;

        background: var(--sev-high);

        background: var(--sev-med);
        color: var(--panel);
      }
      .tag.low {
        background: var(--chip);
        color: var(--sev-low);
      }

        color: var(--accent);
        background: none;

        padding: 0;

        text-align: left;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #panel ol.walk li.cur {
        font-weight: 600;
      }
      #panel ol.walk li.cur::marker {
        color: var(--accent);
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--ac);
        margin-right: 6px;
        vertical-align: 0;
      }
      .group {
        margin-top: 14px;
      }
      @media (max-width: 760px) {
        main {
          flex-direction: column;
        }

          height: 58%;
          border-left: 0;

          padding-right: max(16px, env(safe-area-inset-right, 0px));
          padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
        }
        header.top h1 {
          font-size: 17px;
        }
        .tools {
          margin-left: 0;
        }
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #world.anim {
          transition: transform 0.35s ease;
        }
      }

              })
              .join("") +
            "</ul>";
          openPanel(h);
        }
        function showUntraced() {
          clearSel();
          var h =
            "<h2>Not traced</h2><p>The readers could not trace these parts from the code. They are listed here instead of guessed.</p>";
          D.sections.forEach(function (s) {
            var u = D.untraced.filter(function (x) {
              return x.section === s.id;
            });
            if (!u.length) return;
            h +=
              '<div class="group"><h4><span class="dot" style="--ac:var(--a-' +
              s.id +
              ')"></span>' +
              esc(s.label) +
              "</h4><ul>" +
              u
                .map(function (x) {
                  return "<li>" + esc(x.text) + "</li>";
                })
                .join("") +
              "</ul></div>";
          });
          openPanel(h);
        }
        $("#bFlows").onclick = showFlowList;
        $("#bFragile").onclick = showFragile;
        $("#bUntraced").onclick = showUntraced;
        world.addEventListener("click", function (ev) {
          if (moved) {
            moved = false;
            return;
          }
          var b = ev.target.closest(".box");
          if (b) {
            showComp(b.dataset.id, false);
            return;
          }
          var s = ev.target.closest(".step");
          if (s) {
            showStep(s.dataset.flow, +s.dataset.i, false);
            return;
          }
          var h = ev.target.closest(".flow h3");
          if (h) {
            showStep(h.dataset.flow, 0, true);
            return;
          }
        });
        panel.addEventListener("click", function (ev) {
          var t = ev.target.closest("[data-go-comp],[data-go-step]");
          if (!t) return;
          if (t.dataset.goComp) showComp(t.dataset.goComp, true);
          else {
            var p = t.dataset.goStep.split(":");
            showStep(p[0], +p[1], true);
          }
        });
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && !panel.hidden) closePanel();
        });
        window.__map = {
          view: view,
          fit: fit,
          showComp: showComp,
          showStep: showStep,
          W: W,
          H: H,
        };
        fit(false);
      })();
    </script>
  </body>
</html>
