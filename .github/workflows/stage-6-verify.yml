name: Stage 6 verification

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Seed worker test config
        run: |
          cp wrangler.jsonc.ci wrangler.jsonc
          mkdir -p dist/client
      - name: Run formatter
        run: |
          yarn format
          git diff --exit-code
      - run: node scripts/check-lockfile-integrity.mjs
      - run: yarn tsc --noEmit
      - run: yarn test
      - run: yarn test:web
