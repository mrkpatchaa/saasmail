name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Seed wrangler.jsonc (gitignored; needed by vitest-pool-workers)
        run: cp wrangler.jsonc.ci wrangler.jsonc
      - name: Create empty assets dir (referenced by wrangler.jsonc)
        run: mkdir -p dist/client
      - name: Type check
        run: yarn typecheck
      - name: Focused Workers ledger test
        run: yarn vitest run worker/src/__tests__/mail-agent-approval-ledger.test.ts --config vitest.config.test.ts
      - name: Focused unpatched approval continuation test
        run: yarn vitest run src/agent/useAgentChat.approval-continuation.test.tsx --config vitest.config.web.ts
