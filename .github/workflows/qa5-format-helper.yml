name: Temporary format helper

on:
  push:
    branches: [fix-qa-5]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-qa-5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Format changed sources
        run: |
          yarn prettier --write \
            e2e/specs/agent.spec.ts \
            src/agent/AgentChatSession.approval.test.tsx \
            src/agent/AgentChatSession.tsx \
            src/agent/AgentMarkdown.test.tsx \
            src/agent/AgentMarkdown.tsx \
            src/components/AgentPanel.tsx \
            src/components/DashboardLayout.tsx \
            worker/src/__tests__/agent-runtime.test.ts \
            worker/src/__tests__/suggest-reply.test.ts \
            worker/src/agent/mail-agent.ts \
            worker/src/lib/agent/suggest-reply.ts
      - name: Push formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "saasmail-format-helper"
          git config user.email "actions@users.noreply.github.com"
          git add e2e/specs/agent.spec.ts src/agent/AgentChatSession.approval.test.tsx src/agent/AgentChatSession.tsx src/agent/AgentMarkdown.test.tsx src/agent/AgentMarkdown.tsx src/components/AgentPanel.tsx src/components/DashboardLayout.tsx worker/src/__tests__/agent-runtime.test.ts worker/src/__tests__/suggest-reply.test.ts worker/src/agent/mail-agent.ts worker/src/lib/agent/suggest-reply.ts
          git commit -m "style: format QA fixes"
          git push origin HEAD:fix-qa-5
